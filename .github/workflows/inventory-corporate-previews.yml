name: Recover existing corporate preview evidence (no deployment)
on:
  push:
    branches: [arena/beb13e2a-monte-wo]
    paths: [.github/workflows/inventory-corporate-previews.yml, scripts/inventory-corporate-previews.mjs, scripts/capture-recovered-previews.mjs]
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: arena/beb13e2a-monte-wo}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Inspect existing public snapshots and capture desktop/mobile evidence; Cloudflare GET only
        if: ${{ hashFiles('docs/preview-recovery/evidence/inventory.json') == '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/inventory-corporate-previews.mjs
      - name: Capture remaining historical corporate versions without changing them
        run: node scripts/capture-recovered-previews.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: existing-corporate-preview-recovery
          path: docs/preview-recovery/evidence/
      - name: Save only public recovery evidence on the session branch; no production publication
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/preview-recovery/evidence/
          git diff --cached --quiet && exit 0
          git commit -m 'Save existing preview inventory and actual desktop/mobile screenshots'
          git push origin HEAD:arena/beb13e2a-monte-wo

name: Read-only corporate edge verification
on:
  push:
    branches: [arena/beb13e2a-monte-wo]
    paths: [.github/workflows/diagnose-corporate-edge.yml, scripts/inspect-corporate-edge.mjs, scripts/probe-corporate-browser.mjs]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci
      - name: Read-only public routing and edge settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/inspect-corporate-edge.mjs
      - run: npx playwright install --with-deps chromium
      - name: Normal browser navigation without challenge bypass
        run: node scripts/probe-corporate-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corporate-edge-read-only-evidence
          path: evidence/

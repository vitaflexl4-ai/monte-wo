name: Deploy VitaFlex Business Group
on:
  push:
    branches: [arena/beb13e2a-monte-wo]
  workflow_dispatch: {}
concurrency:
  group: production-deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm ci
      - name: Inspect current production before deployment
        run: |
          mkdir -p evidence
          set +e
          curl --fail --location --retry 2 --max-time 40 -D evidence/before-headers.txt https://vitaflexbusinessgroup.com -o evidence/before.html 2> evidence/before-error.txt
          result=$?
          echo "Pre-deployment domain inspection exit code: $result" | tee -a "$GITHUB_STEP_SUMMARY"
          cat evidence/before-error.txt >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser and layout tests
        run: |
          python3 -m http.server 8080 --bind 0.0.0.0 --directory public > /tmp/site.log 2>&1 &
          node --input-type=module -e "import('./tests/group-browser.mjs').catch(e=>{console.error('::error title=Group browser validation::'+String(e.stack||e).replaceAll('\n',' | '));process.exit(1)})"
          PROFILE_SCREENSHOT_DIR=evidence/sony-profile-screenshots node --input-type=module -e "import('./tests/founder-browser.mjs').catch(e=>{console.error('::error title=Profile browser validation::'+String(e.stack||e).replaceAll('\n',' | '));process.exit(1)})"
          node tests/approved-restoration-browser.mjs
          TEST_ORIGIN=http://localhost:8080 SONY_SCREENSHOTS=evidence/sony-screenshots node tests/sony-experiences-browser.mjs
      - name: SEO and content regression tests
        run: |
          node --test tests/seo.test.js tests/founder.test.js tests/group.test.js tests/master-execution.test.js tests/business.test.js tests/approved-restoration.test.js tests/sony-experiences.test.js tests/sony-profile.test.js
          VERIFY_ORIGIN=http://127.0.0.1:8080 SEO_AUDIT_OUTPUT=evidence/local-sitemap-audit.json node scripts/audit-public-seo.mjs
      - name: Compare restored corporate files against the exact owner-selected reference
        run: node scripts/verify-approved-corporate.mjs
      - name: Publish to the existing main-domain project
        id: publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXPECTED_PRODUCTION_REVISION: 6268964ebb4c6b94609fdae2be10a69e41ea3515
        run: node scripts/publish-group-domain.mjs
      - name: Diagnose deployed origin and domain routing
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/group-deployment-diagnostics.mjs
      - name: Verify domain-owning production project
        env:
          VERIFY_ORIGIN: https://vitaflex.pages.dev
        run: |
          set -o pipefail
          node scripts/verify-group.mjs | tee evidence/production-project-verification.txt
          SEO_AUDIT_OUTPUT=evidence/production-sitemap-audit.json node scripts/audit-public-seo.mjs
      - name: Verify published cinematic book on desktop and mobile
        env:
          TEST_ORIGIN: https://vitaflex.pages.dev
          SONY_SCREENSHOTS: evidence/production-sony-screenshots
        run: |
          node tests/sony-experiences-browser.mjs
          echo "::notice title=Sony live browser verification::PASS passive cinematic book at seven widths, automatic opening and chapter sequence, finite final hold, no controls or tracking, static no-JS/reduced-motion editions and preserved corporate homepage."
      - name: Verify public corporate footer and alias (User-Agent probe, not verified crawler traffic)
        env:
          VERIFY_ORIGIN: https://vitaflexbusinessgroup.com
          VERIFY_USER_AGENT: Googlebot
        run: |
          set -o pipefail
          node scripts/verify-group.mjs | tee evidence/public-footer-alias-probe.txt
      - name: Verify public domain and protected API
        run: |
          set -o pipefail
          SEO_AUDIT_OUTPUT=evidence/preferred-domain-sitemap-audit.json node scripts/audit-public-seo.mjs
          node scripts/verify-group.mjs 2>&1 | tee evidence/verification.txt
          git rev-parse HEAD > evidence/revision.txt
      - name: Verify restored live desktop and mobile browsers (no challenge bypass)
        if: ${{ always() && steps.publish.outcome == 'success' }}
        run: node scripts/verify-restored-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: group-deployment-evidence
          path: |
            evidence/
            /tmp/vitaflex-desktop.png
            /tmp/vitaflex-mobile.png
            /tmp/restored-corporate-desktop.png
            /tmp/restored-corporate-mobile.png

name: Publish approved venture launch hold
on:
  push:
    branches: [arena/beb13e2a-monte-wo]
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[launch-hold]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm ci
      - run: npm run build
      - run: node --test tests/venture-lock.test.js tests/sony-biography-refinement.test.js
      - run: npx playwright install --with-deps chromium
      - name: Local responsive and navigation checks
        run: |
          python3 -m http.server 8080 --bind 0.0.0.0 --directory public > /tmp/site.log 2>&1 &
          TEST_ORIGIN=http://localhost:8080 LOCK_SCREENSHOTS=evidence/lock-local node tests/venture-lock-browser.mjs
          VERIFY_ORIGIN=http://localhost:8080 SEO_AUDIT_OUTPUT=evidence/local-audit.json node scripts/audit-public-seo.mjs
      - name: Publish to the existing project with exact baseline and binding guards
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXPECTED_PRODUCTION_REVISION: efd58a446f1e332b0f01f8757fa8944e367522f0
        run: node scripts/publish-group-domain.mjs
      - name: Verify production hold and preserved personal/product pages
        env:
          VERIFY_ORIGIN: https://vitaflex.pages.dev
          TEST_ORIGIN: https://vitaflex.pages.dev
          LOCK_SCREENSHOTS: evidence/lock-production
          SEO_AUDIT_OUTPUT: evidence/production-audit.json
        run: |
          node scripts/verify-venture-lock.mjs
          node tests/venture-lock-browser.mjs
          node scripts/audit-public-seo.mjs
      - name: Diagnose existing production routing without changes
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/group-deployment-diagnostics.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-hold-evidence
          path: evidence/

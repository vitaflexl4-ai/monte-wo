name: MONTE WO CI and Scheduled Health Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *' # hourly health checks; GitHub schedules use UTC

permissions:
  contents: read
  issues: write

concurrency:
  group: monte-wo-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Required tests and safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install website dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Build website using test-only origin
        run: npm run build
        env:
          SITE_ORIGIN: https://monte-wo.test
      - name: Run website and platform tests
        run: npm test
      - name: Install mobile dependencies
        run: npm ci --prefix apps/mobile
      - name: Type-check mobile app
        run: npm run typecheck --prefix apps/mobile
      - name: Run mobile build-safety tests
        run: npm run test:build-safety --prefix apps/mobile
      - name: Open or update monitoring issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'MONTE WO scheduled health check is failing';
            const body = [
              'The scheduled MONTE WO health check failed.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Commit: ${context.sha}`,
              '',
              'Review the failing step and fix the underlying issue. This alert does not automatically modify application code.'
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
      - name: Verification summary
        if: always()
        run: |
          {
            echo "## MONTE WO verification"
            echo "- Commit: $GITHUB_SHA"
            echo "- Event: $GITHUB_EVENT_NAME"
            echo "- Status: ${{ job.status }}"
            echo "- Production deployment only runs from main after verification succeeds."
          } >> "$GITHUB_STEP_SUMMARY"


# MONTE WO — Android App Bundle build (Capacitor shell around the web build).
#
# Manual trigger only. It never uploads anything to Google Play: the resulting .aab is a
# workflow artifact that the account holder reviews and uploads through Play Console
# (see docs/release/ANDROID_RELEASE.md). Nothing in this file embeds a secret; signing
# material is read from repository secrets at run time and never written to Git.
#
# Required repository secrets for a SIGNED bundle (all four, otherwise the bundle is UNSIGNED):
#   ANDROID_KEYSTORE_BASE64   base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias inside the keystore
#   ANDROID_KEY_PASSWORD      key password
name: Android release bundle (manual)

on:
  # Manual run from the Actions tab (inputs below), or a push to an arena/* working branch whose
  # commit message contains "[build-native]" (the agent sandbox cannot dispatch workflows).
  push:
    branches: ["arena/**"]
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName shown to users (semver, e.g. 0.1.0)"
        required: true
        default: "0.1.0"
      version_code:
        description: "versionCode (integer; must increase for every Play upload)"
        required: true
        default: "1"

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Build .aab
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-native]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Java 21 (required by Capacitor 8 / AGP 8.13)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK (preinstalled on GitHub Ubuntu runners) — accept licenses, ensure packages
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | head -n1)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
          echo "sdk.dir=$SDK" > android/local.properties

      - name: Install dependencies (lockfile)
        run: npm ci

      - name: "Web build (source of truth is content/ + scripts/)"
        run: npm run build

      - name: Web unit tests (one documented pre-existing baseline item tolerated — RELEASE_STATUS.md §4 item 8)
        run: |
          set +e
          node --test --test-reporter=tap tests/*.test.js > tap.log 2>&1; code=$?
          set -e
          grep -E '^\s*not ok|^# (tests|pass|fail)' tap.log || true
          if [ "$code" -ne 0 ]; then
            # Allowed: only the website guard test, and only because of public/assets/INTER-LICENSE.txt (stale hash in docs/website/baseline.json on main).
            if grep -E '^\s*not ok' tap.log | grep -vqE 'Website: original assets|tests/website\.test\.js' || ! grep -q '# fail 1' tap.log || ! grep -q 'INTER-LICENSE.txt' tap.log; then
              # Surface every failing test (and its first assertion detail) as annotations: job logs are not always reachable from the maintainer's tooling.
              grep -nE '^\s*not ok' tap.log | head -n 9 | while IFS= read -r line; do
                n="${line%%:*}"; detail="$(sed -n "$((n+1)),$((n+40))p" tap.log | grep -E '^\s*(error|message|expected|actual|code|stack):' | head -n 4 | tr -s ' ' | tr '\n' ' ' | cut -c1-900)"
                echo "::error title=unit test failed::${line#*:} :: ${detail}"
              done
              echo "::error::unexpected unit-test failures ($(grep -cE '^\s*not ok' tap.log) failing)"; tail -n 120 tap.log; exit 1
            fi
            echo "::warning::npm test: only the documented pre-existing baseline item failed (public/assets/INTER-LICENSE.txt vs docs/website/baseline.json, present on main) — every other test passed"
          fi

      - name: Keep the unit-test TAP log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-tap-log
          path: tap.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Native bundle + Capacitor sync
        run: |
          npm run build:native
          npx cap sync android
          cat build/native/native-build.json

      - name: Prepare signing material (only if secrets exist)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"
            echo "Signing keystore provided; bundle will be signed."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: building an UNSIGNED bundle (Play Console will reject it)."
          fi

      - name: Gradle bundleRelease
        working-directory: android
        env:
          MONTE_WO_VERSION_NAME: ${{ inputs.version_name || '0.1.0' }}
          MONTE_WO_VERSION_CODE: ${{ inputs.version_code || '1' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace bundleRelease

      - name: Report signature state
        env:
          MONTE_WO_VERSION_NAME: ${{ inputs.version_name || '0.1.0' }}
          MONTE_WO_VERSION_CODE: ${{ inputs.version_code || '1' }}
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          ls -la "$AAB"
          if jarsigner -verify "$AAB" >/dev/null 2>&1; then
            echo "signed=yes" >> "$GITHUB_STEP_SUMMARY"
            echo "Bundle is signed."
          else
            echo "signed=NO (unsigned bundle, not uploadable)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Bundle is unsigned."
          fi
          echo "versionName=$MONTE_WO_VERSION_NAME versionCode=$MONTE_WO_VERSION_CODE" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload .aab artifact
        uses: actions/upload-artifact@v4
        with:
          name: monte-wo-android-${{ inputs.version_name || '0.1.0' }}-${{ inputs.version_code || '1' }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

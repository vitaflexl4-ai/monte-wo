name: Read-only corporate production diagnostics
on:
  push:
    branches: [arena/beb13e2a-monte-wo]
    paths: [.github/workflows/diagnose-corporate-production.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read existing project metadata only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import {readFile, appendFile} from 'node:fs/promises';
          const {account_id} = JSON.parse(await readFile('deploy.config.json','utf8'));
          if (!process.env.CLOUDFLARE_API_TOKEN) throw new Error('Existing connection is not available');
          // Exactly one GET. No Wrangler, deployment, configuration writes, migrations or resource creation.
          const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account_id}/pages/projects/vitaflex`, {
            method: 'GET',
            headers: {Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`},
            signal: AbortSignal.timeout(30000)
          });
          if (!response.ok) throw new Error(`Read-only project lookup failed: HTTP ${response.status}`);
          const body = await response.json();
          if (!body.success || body.result?.name !== 'vitaflex') throw new Error('Project lookup did not confirm the expected target');
          const p = body.result, d = p.canonical_deployment;
          const output = {
            observedAt: new Date().toISOString(), project: p.name,
            domains: p.domains, productionBranchLabel: p.production_branch,
            sourceType: p.source?.type ?? 'direct-upload',
            deploymentId: d?.id ?? null, deploymentUrl: d?.url ?? null,
            deploymentEnvironment: d?.environment ?? null,
            revision: d?.deployment_trigger?.metadata?.commit_hash ?? null,
            recordedDeploymentBranch: d?.deployment_trigger?.metadata?.branch ?? null,
            deploymentStatus: d?.latest_stage?.status ?? null,
            productionHasD1Bindings: Object.keys(p.deployment_configs?.production?.d1_databases ?? {}).length > 0,
            productionHasR2Bindings: Object.keys(p.deployment_configs?.production?.r2_buckets ?? {}).length > 0
          };
          // Whitelisted public metadata and binding-presence booleans only: never print the response or config values.
          console.log('::notice title=Read-only corporate production metadata::'+JSON.stringify(output));
          await appendFile(process.env.GITHUB_STEP_SUMMARY, '## Read-only corporate production metadata\n\n```json\n'+JSON.stringify(output,null,2)+'\n```\n\nOne GET request; no publication or configuration changes.\n');
          JS

# MONTE WO — one-click production deployment of the Intelligence Command Center.
#
# Requires ONE secret (owner adds it in GitHub → Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN — a Cloudflare API token (My Profile → API Tokens → Create Token
#   → Custom token) with these permissions:
#       Account · Cloudflare Pages · Edit
#       Account · D1 · Edit
#       Account · Workers Scripts · Edit
#
# Triggering:
#   - After this workflow is on the default branch: the "Run workflow" button (workflow_dispatch).
#   - From this branch: push a commit whose message contains [deploy] — explicit, auditable,
#     never a surprise deploy. All deployment values come from deploy.config.json.
#
# The deploy itself is scripts/deploy-intelligence.mjs: fail-closed, idempotent, and it
# verifies the deployed API refuses unauthenticated access (aborts on any 200).
name: Deploy Intelligence Command Center

on:
  workflow_dispatch: {}
  push:
    branches: [arena/42a98d64-monte-wo]

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Python (site build)
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install
        run: npm ci
      - name: Check token presence (no value is ever printed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN secret is not set. GitHub → Settings → Secrets and variables → Actions → New repository secret.'; exit 3; }
      - name: Deploy (all values from deploy.config.json)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/deploy-intelligence.mjs

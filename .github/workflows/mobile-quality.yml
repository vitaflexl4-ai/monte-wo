name: MONTE WO mobile quality checks

on:
  push:
    branches:
      - feature/monte-wo-experience-completion
  pull_request:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - "shared/**"
      - ".github/workflows/mobile-quality.yml"

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install locked mobile dependencies
        run: npm ci --prefix apps/mobile
      - name: Report runtime dependency advisories
        working-directory: apps/mobile
        run: |
          npm audit --omit=dev --json > /tmp/montewo-npm-audit.json || true
          node -e 'const a = require("/tmp/montewo-npm-audit.json"); console.log(JSON.stringify({counts:a.metadata?.vulnerabilities, advisories:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable}))}, null, 2))'
      - name: Type-check the mobile app
        run: npm run typecheck --prefix apps/mobile
      - name: Run mobile build-safety tests
        run: npm run test:build-safety --prefix apps/mobile

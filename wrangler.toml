# Monte Wo by Vitaflex — deployable Cloudflare Pages website.
# No Cloudflare account resources are required for local preview.
name = "vitaflex-monte-wo"
compatibility_date = "2025-01-01"
pages_build_output_dir = "public"

# OPTIONAL: Create the R2 bucket, then uncomment these three lines.
# npx wrangler r2 bucket create monte-wo-workout-gifs
# [[r2_buckets]]
# binding = "WORKOUT_GIFS_BUCKET"
# bucket_name = "monte-wo-workout-gifs"

# WAITLIST: Create the D1 database and replace the commented ID with the returned ID.
# npx wrangler d1 create monte-wo-waitlist
# [[d1_databases]]
# binding = "DB"
# database_name = "monte-wo-waitlist"
# database_id = "PASTE_THE_ID_FROM_CLOUDFLARE_HERE"
# migrations_dir = "migrations"

# Set TURNSTILE_SITE_KEY as a production variable in Cloudflare Pages settings.
# Set TURNSTILE_SECRET and RATE_LIMIT_SALT as encrypted secrets (never in this file).
# Without the binding and all three values, signup safely stays unavailable.

# Public Turnstile site key; never put the secret key in source.
# [vars]
# TURNSTILE_SITE_KEY = "PASTE_YOUR_PUBLIC_SITE_KEY_HERE"

# PRIVATE INTELLIGENCE COMMAND CENTER — separate D1 database, never the waitlist or app DB.
# 1. npx wrangler d1 create monte-wo-intelligence
# 2. Apply migrations/0003_intelligence.sql then migrations/0004_intelligence_ops.sql to it.
# 3. Uncomment and paste the database_id. Pages Functions read it through the INTEL_DB binding.
# 4. Set INTELLIGENCE_ACCESS_ISSUER and INTELLIGENCE_ACCESS_AUD vars (Cloudflare Access app).
# 5. Set INTELLIGENCE_INGEST_KEY as an encrypted secret if mobile telemetry intake is enabled.
# Protect BOTH /intelligence/ and /api/intelligence/* with the same Cloudflare Access application;
# the API additionally verifies the Access JWT server-side and checks intel_operators.
# [[d1_databases]]
# binding = "INTEL_DB"
# database_name = "monte-wo-intelligence"
# database_id = "PASTE_THE_ID_FROM_CLOUDFLARE_HERE"

# OPTIONAL RESTRICTED STRENGTH INDEX PILOT — disabled until configured and reviewed.
# Application data lives in its OWN database bound as APP_DB (server/strength/api.js ignores
# the waitlist binding unless RANKING_LEGACY_DB_ENABLED="true", which production never sets).
# npx wrangler d1 create monte-wo-app ; apply 0002_strength_index.sql, then 0007_native_auth_codes.sql.
# [[d1_databases]]
# binding = "APP_DB"
# database_name = "monte-wo-app"
# database_id = "PASTE_THE_ID_FROM_CLOUDFLARE_HERE"
# Configure RANKING_ENABLED, RANKING_ACCESS_ISSUER and RANKING_ACCESS_AUD in Pages.
# Protect private /api/strength routes with Cloudflare Access; /config and /catalog
# may be public readiness/methodology exceptions (neither returns athlete data).
# [[r2_buckets]]
# binding = "RANKING_EVIDENCE"
# bucket_name = "montewo-private-performance-evidence"
# Keep this bucket private and separate from WORKOUT_GIFS_BUCKET.
# Publishing stays OFF. Only after independent review, configure
# RANKING_PUBLISH_ENABLED=true and RANKING_APPROVED_DIGESTS with approved hashes.

# OPTIONAL AGENT API (server/agent.js) — inert unless AGENT_API_ENABLED="true"; see docs/release/AGENT_API.md.
# Keys, audit and shared memory live in the AGENT_DB binding: either the intelligence database above
# (same database_id as INTEL_DB) or a dedicated one — never the waitlist database. Apply 0008_agent_api.sql to it.
# [[d1_databases]]
# binding = "AGENT_DB"
# database_name = "monte-wo-intelligence"
# database_id = "PASTE_THE_ID_FROM_CLOUDFLARE_HERE"
# Policy flags (Pages variables, default off): AGENT_PII_ENABLED, AGENT_STRENGTH_PRIVILEGED_ENABLED, AGENT_RATE_LIMIT.

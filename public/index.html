
<!-- Montewo AI Workout Section -->
<div style="font-family: Arial, sans-serif; max-width: 500px; margin: 20px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); background: white;">
    <h2 style="color: #333; margin-top: 0;">🏋️ Montewo AI Workout</h2>
    
    <label style="font-size: 12px; color: #666;">Enter Free Gemini API Key:</label>
    <input type="password" id="geminiKey" placeholder="Paste your API key here" style="width: 100%; padding: 10px; margin: 5px 0 15px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">

    <label style="font-size: 14px; font-weight: bold; color: #333;">What is your fitness goal?</label>
    <input type="text" id="userGoal" placeholder="e.g., 3 day full body hypertrophy, home workout" style="width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
    
    <button onclick="askMontewoAI()" style="width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 5px;">Generate Routine</button>

    <div id="aiOutput" style="margin-top: 15px; padding: 10px; background: #f9f9f9; border-left: 4px solid #007bff; font-size: 14px; line-height: 1.5; white-space: pre-wrap; display: none;"></div>
</div>

<script>
async function askMontewoAI() {
    const key = document.getElementById('geminiKey').value;
    const goal = document.getElementById('userGoal').value;
    const outputBox = document.getElementById('aiOutput');

    if (!key) { alert('Please paste your free Gemini API key first!'); return; }
    if (!goal) { alert('Please enter a goal!'); return; }

    outputBox.style.display = "block";
    outputBox.innerText = "✨ Montewo AI is crafting your workout routine...";

    try {
        const response = await fetch(`https://googleapis.com{key}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                contents: [{ parts: [{ text: `You are the elite Montewo AI Fitness Engine. Create a professional, clear, step-by-step workout routine with sets, reps, and rest schemes for this goal: ${goal}` }] }]
            })
        });
        
        const data = await response.json();
        const workoutText = data.candidates[0].content.parts[0].text;
        outputBox.innerText = workoutText;
    } catch (error) {
        outputBox.innerText = "❌ Error generating workout. Please make sure your API key is active and correct.";
    }
}
</script>
